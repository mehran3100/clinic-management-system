server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8093/realms/clinic-realm
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      routes:
        - id: patient-service
          uri: lb://patient-service
          predicates:
            - Path=/patients/**
          filters:
            - StripPrefix=1
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/appointments/**
          filters:
            - StripPrefix=1

eureka:
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-server:8761/eureka
      webclient:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Aggregate downstream OpenAPI specs via Gateway paths
    urls:
      - name: patient-service
        url: /patient-service/v3/api-docs
      - name: appointment-service
        url: /appointment-service/v3/api-docs

    # Enable OAuth button in the UI (Keycloak/Authorization Code + PKCE)
    oauth:
      client-id: cms-swagger-ui
      use-pkce-with-authorization-code-grant: true
# If you customize api-docs paths in services, update the URLs above accordingly.
